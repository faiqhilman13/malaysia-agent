[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "malaysia-agent-ops"
version = "0.1.0"
description = "Malaysia-first API and CLI primitives for agentic business operations."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Faiq Hilman" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
malaysia_agent_ops = ["data/*.json"]
